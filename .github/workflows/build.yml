name: Build APK

on:
  push:
    branches: [ main, claude/project-updates-features-TMW5P ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          export GRADLE_HOME=/tmp/gradle/gradle-8.7
          export PATH=$PATH:$GRADLE_HOME/bin
          echo "GRADLE_HOME=$GRADLE_HOME" >> $GITHUB_ENV
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/bankyar.jks

      - name: Build Release APK
        run: gradle assembleRelease
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PATH: ${{ github.workspace }}/bankyar.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bankyar-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Delete previous latest release
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version name
        id: version
        run: echo "name=$(grep versionName app/build.gradle.kts | grep -oP '\"[^\"]+\"' | tr -d '\"')" >> $GITHUB_OUTPUT

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "بانک‌یار نسخه ${{ steps.version.outputs.name }}"
          body: |
            آخرین نسخه بانک‌یار — نصب مستقیم روی اندروید

            **نسخه:** `${{ steps.version.outputs.name }}`
            **کامیت:** `${{ github.sha }}`
            **شاخه:** `${{ github.ref_name }}`
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f ${{ github.workspace }}/bankyar.jks
          rm -f ${{ github.workspace }}/keystore.properties
